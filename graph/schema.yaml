# ============================================================
# AGN1 GRAPH SCHEMA — parent schema for all graph collections
# ============================================================
# Edit this file → run sync_schema.py to apply everywhere.
#
# Structure:
#   schema.yaml          ← THIS FILE (parent)
#   collections/
#     projects.yaml      ← project-specific types
#     bittensor.yaml     ← bittensor-specific types
#     decisions.yaml     ← research/decision types
#
# Each collection inherits from parent, can add its own types.
# Relationship rules enforce which nodes can connect to which.
# ============================================================

# Global node types (available in ALL collections)
global_nodes:
  Category:
    properties:
      name: string (required)
    indexes: [name]
    description: "Thesis category (verifiable_execution, agent_economy, etc.)"

  Technology:
    properties:
      name: string (required)
      type: string
    indexes: [name]
    description: "Technology primitive (TEE, zkML, ERC-8004, etc.)"

  Standard:
    properties:
      name: string (required)
      url: string
    indexes: [name]
    description: "Industry standard (ERC-8004, x402, etc.)"

  Person:
    properties:
      name: string (required)
      github: string
      role: string
    indexes: [name]
    description: "Key developer/researcher"

  Source:
    properties:
      name: string (required)
      url: string
      type: string
    indexes: [name]
    description: "Data source (DefiLlama, CoinGecko, GitHub, etc.)"

# Global relationship types (available in ALL collections)
global_relationships:
  IN_CATEGORY:
    from: "*"  # any node can link to a category
    to: Category

  USES_TECHNOLOGY:
    from: "*"
    to: Technology

  FOLLOWS_STANDARD:
    from: "*"
    to: Standard

  CONTRIBUTED_BY:
    from: "*"
    to: Person

  REPORTED_BY:
    from: "*"
    to: Source

# Collection-specific schemas (loaded from collections/*.yaml)
collections:
  projects:
    file: collections/projects.yaml
  bittensor:
    file: collections/bittensor.yaml
  decisions:
    file: collections/decisions.yaml
